version: "3.9"

services:
  backend:
    image: registry.digitalocean.com/phishy-registry/backend:backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers
    env_file:
      - .env
    depends_on:
      - mongo
      - postgres
    ports:
      - "8000:8000"

  frontend:
    image: registry.digitalocean.com/phishy-registry/backend:frontend
    restart: unless-stopped
    ports:
      - "3000:80"

  mongo:
    image: mongo:6
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: phishy_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  mongo_data:
  postgres_data: