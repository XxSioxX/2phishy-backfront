services:
  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
  mongo:
    image: mongo:6
    volumes:
      - mongo_data:/data/db
    restart: always
    container_name: mongo
    command: ["mongod", "--auth"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "127.0.0.1:27017:27017"

  redis:
    image: redis:7
    container_name: redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data


  backend:
    image: ${REGISTRY:-localhost:5000}/backend:${TAG:-latest-dev}
    ports:
      - "${BACKEND_PORT}:8000"
    env_file:
      - .env
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --proxy-headers
      --forwarded-allow-ips="*"
    depends_on:
      - postgres
      - mongo
      - redis

  frontend:
    image: ${REGISTRY:-localhost:5000}/frontend:${TAG:-latest-dev}
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend
      - redis

volumes:
  postgres_data:
  mongo_data:
  redis_data:
